# ============================================================
# Audio Source Separation Guided by Simulated On-Body
# Vibration Signals for Overlapping Bird Vocalizations
# ============================================================

# --- Dataset ---
dataset:
  wav_dir: "wavfiles"                
  metadata_csv: "metadata.csv"        
  sample_rate: 22050                   
  clip_duration: 3.0                   
  min_clip_duration: 1.0               
  max_species_per_mix: 3               
  num_mixtures: 10000                  
  overlap_ratios: [0.3, 0.6, 0.9]     # Overlap ratio variants for testing
  train_split: 0.70
  val_split: 0.15
  test_split: 0.15
  seed: 42

# --- Vibration Simulation ---
vibration:
  lowpass_cutoff_hz: 500              
  envelope_smoothing_ms: 20           
  noise_std: 0.02                     
  transient_prob: 0.15                
  transient_amplitude: 0.3           
  per_bird: true                      

# --- Model Architecture ---
model:
  # Audio Encoder
  audio_encoder_channels: 256
  audio_encoder_kernel_size: 16
  audio_encoder_stride: 8
  # Vibration Encoder
  vib_encoder_channels: 128
  vib_encoder_layers: 4
  # Separator (TCN)
  tcn_channels: 256
  tcn_kernel_size: 3
  tcn_layers: 8
  tcn_stacks: 3
  # FiLM Conditioning
  film_hidden_dim: 256
  # Output
  num_speakers: 2                     

# --- Training ---
training:
  batch_size: 8
  num_epochs: 100
  learning_rate: 1.0e-3
  weight_decay: 1.0e-5
  lr_scheduler: "cosine"
  warmup_epochs: 5
  early_stopping_patience: 15
  grad_clip_norm: 5.0
  loss_weights:
    time_domain: 0.5                  
    spectral: 0.5                     
  device: "cuda"                      
  num_workers: 4
  checkpoint_dir: "experiments/checkpoints"
  log_dir: "experiments/logs"

# --- Evaluation ---
evaluation:
  metrics: ["SDR", "SI-SDR", "SIR", "SAR", "spectral_convergence", "log_spectral_distance"]
  overlap_test_thresholds: [0.3, 0.6, 0.9]
  significance_level: 0.05            

# --- Ablation ---
ablation:
  run_audio_only_baseline: true
  run_vibration_conditioned: true
  vibration_noise_levels: [0.0, 0.02, 0.05, 0.1]
